name: Deploy

on:
  push:
    branches: [main]

env:
  IMAGE: ghcr.io/nakan4u/caminos-hub
  # Tests need no database (see CLAUDE.md), but `npm ci`'s postinstall runs
  # `prisma generate`, which loads prisma.config.ts and requires DATABASE_URL
  # to be resolvable. A syntactically valid dummy is enough — nothing connects.
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm test

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      # DEPLOY_SSH_KEY_B64 is the private key base64-encoded to a single line
      # (`base64 -w0 ~/.ssh/caminos_hub_deploy`), which survives GitHub's secret
      # store without the newline mangling that breaks a pasted multi-line key.
      - name: Restore deploy key
        run: |
          printf '%s' '${{ secrets.DEPLOY_SSH_KEY_B64 }}' | base64 -d > "$RUNNER_TEMP/deploy_key"
          chmod 600 "$RUNNER_TEMP/deploy_key"
          ssh-keygen -y -f "$RUNNER_TEMP/deploy_key" > /dev/null && echo "deploy key parsed OK"
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key_path: ${{ runner.temp }}/deploy_key
          script: |
            cd /opt/caminos-hub
            docker compose pull
            docker compose up -d --remove-orphans
